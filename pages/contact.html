<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Foundational Aesthetic Wellness</title>
<meta name="description" content="Contact Foundational Aesthetic Wellness in Devon, PA.">
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/images/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-base="../">
<main id="page-main" class="site-page">

<section class="page-hero">
  <div class="page-hero__bg" style="background-image:url('https://assets.laserskinpa.com/Images/Sites/D/DevonDermatologyServices/MasterPage/1302079.jpg')"></div>
  <div class="page-hero__overlay"></div>
  <div class="page-hero__inner">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="../index.html">Home</a><span class="sep">/</span><span>Contact</span>
    </nav>
    <h1>Contact Us</h1>
  </div>
</section>

<div class="page-body">
  <div class="contact-page-grid">
    <div>
      <h2>Get In Touch</h2>
      <div class="cinfo-block">
        <h4>Address</h4>
        <p>92 Lancaster Avenue, Suite 120<br>Devon, PA 19333</p>
      </div>
      <div class="cinfo-block">
        <h4>Phone</h4>
        <a href="tel:+16109892224">610.989.2224</a>
      </div>
      <div class="cinfo-block">
        <h4>Hours</h4>
        <p>Monday – Friday: 8:00 AM – 5:00 PM<br>Saturday: Limited Hours<br>Sunday: Closed</p>
      </div>
      <div class="cinfo-block" style="margin-top:24px">
        <button type="button" class="btn-gold" data-open-book-modal>Book Now</button>
      </div>
    </div>
    <div class="contact-form-box">
      <h3>Send Us a Message</h3>
      <div class="form-success-msg" id="formOk">Thank you! Your message has been sent. We will be in touch shortly.</div>
      <form id="cForm" onsubmit="submitForm(event)">
        <div class="form-row2">
          <div class="fg"><label for="fn">First Name *</label><input type="text" id="fn" required placeholder="Jane"></div>
          <div class="fg"><label for="ln">Last Name *</label><input type="text" id="ln" required placeholder="Smith"></div>
        </div>
        <div class="fg"><label for="em">Email Address *</label><input type="email" id="em" required placeholder="jane@example.com"></div>
        <div class="fg"><label for="ph">Phone Number</label><input type="tel" id="ph" placeholder="(610) 555-0000"></div>
        <div class="fg"><label for="msg">Message</label><textarea id="msg" placeholder="Tell us about your skin concerns or questions..."></textarea></div>
        <button type="submit" class="form-submit-btn">Send Message</button>
      </form>
    </div>
  </div>
  <div class="contact-page-map">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3055.6185!2d-75.4350!3d40.0420!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c6972d3e1c5555%3A0x5a4f1fa5ac9e4a2e!2s92+Lancaster+Ave+%23120%2C+Devon%2C+PA+19333!5e0!3m2!1sen!2sus!4v1700000000000" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Foundational Aesthetic Wellness location"></iframe>
  </div>
</div>

</main>

<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/forms.js"></script>
<script src="../assets/js/site-layout.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
